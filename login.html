
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearGo - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="login-header">
        <a href="home.html" class="logo">Gear<span>Go</span></a>
        <a href="home.html" class="back-home">Back to Home</a>
    </header>

    <!-- LOGIN SECTION -->
    <section class="login-section">

        <div class="login-image">
            <div class="image-overlay">
                <h1>Adventure<br>Starts Here.</h1>
                <p>Find your gear. Plan your journey. Make memories.</p>
            </div>
        </div>

        <div class="login-container">

            <div class="login-form">

                <h2>Welcome Back</h2>
                <p class="subtitle">Login to your GearGo account</p>

                <form action="#" method="post">

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email"
                            placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                            placeholder="Enter your password" required>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>

                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>

                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <p class="signup-text">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>

            </div>

        </div>

    </section>

</body>
</html>
